# Enable with: sudo a2enmod wsgi
# Copy to /etc/apache2/sites-available/eggs.conf and enable the site.
<VirtualHost *:80>
    ServerName eggs.example.com
    ServerAlias www.eggs.example.com

    # The Apache user needs read/traverse access to the project and read access
    # to the virtualenv. The SQLite database directory must be writable by it.
    WSGIDaemonProcess eggcellent python-home=/srv/eggcellent/.venv python-path=/srv/eggcellent
    WSGIProcessGroup eggcellent
    WSGIScriptAlias / /srv/eggcellent/config/wsgi.py

    <Directory /srv/eggcellent/config>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    Alias /static/ /srv/eggcellent/staticfiles/
    <Directory /srv/eggcellent/staticfiles>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/eggcellent-error.log
    CustomLog ${APACHE_LOG_DIR}/eggcellent-access.log combined
</VirtualHost>
