# Enable with: sudo a2enmod wsgi rewrite
# HTTPS also requires: sudo a2enmod ssl
# Copy to /etc/apache2/sites-available/joes-trip.conf and enable the site.
WSGIDaemonProcess joes-trip user=www-data group=www-data python-home=/srv/joes-trip-site/.venv python-path=/srv/joes-trip-site

<VirtualHost *:80>
    ServerName murmurent.duckdns.org
    ServerAlias www.murmurent.duckdns.org

    WSGIProcessGroup joes-trip
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /srv/joes-trip-site/config/wsgi.py

    <Directory /srv/joes-trip-site/config>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    Alias /static/ /srv/joes-trip-site/staticfiles/
    <Directory /srv/joes-trip-site/staticfiles>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/joes-trip-error.log
    CustomLog ${APACHE_LOG_DIR}/joes-trip-access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =www.murmurent.duckdns.org [OR]
    RewriteCond %{SERVER_NAME} =murmurent.duckdns.org
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName murmurent.duckdns.org
    ServerAlias www.murmurent.duckdns.org

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/murmurent.duckdns.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/murmurent.duckdns.org/privkey.pem

    WSGIProcessGroup joes-trip
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /srv/joes-trip-site/config/wsgi.py

    <Directory /srv/joes-trip-site/config>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    Alias /static/ /srv/joes-trip-site/staticfiles/
    <Directory /srv/joes-trip-site/staticfiles>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/joes-trip-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/joes-trip-ssl-access.log combined
</VirtualHost>
