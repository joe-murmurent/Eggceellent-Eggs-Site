# Enable with: sudo a2enmod wsgi
# Copy to /etc/apache2/sites-available/joes-trip.conf and enable the site.
<VirtualHost *:80>
    ServerName trip.example.com
    ServerAlias www.trip.example.com

    WSGIDaemonProcess joes-trip user=www-data group=www-data python-home=/srv/joes-trip-site/.venv python-path=/srv/joes-trip-site
    WSGIProcessGroup joes-trip
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /srv/joes-trip-site/config/wsgi.py

    <Directory /srv/joes-trip-site/config>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    Alias /static/ /srv/joes-trip-site/staticfiles/
    <Directory /srv/joes-trip-site/staticfiles>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/joes-trip-error.log
    CustomLog ${APACHE_LOG_DIR}/joes-trip-access.log combined
</VirtualHost>
